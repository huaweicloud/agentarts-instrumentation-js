# DSH AgentArts Observation Plugin. This bundle owns its OTLP gRPC pipeline
# and reports to AgentArts APM/AOM.
# Actual reporting config is loaded from
# ~/.dsh/plugins/agentarts-instrumentation-dsh/config.json (or matching
# environment variables) at runtime.
#
# The row is inserted enabled=true so the plugin can pick up an existing
# config automatically. When no usable APM/AOM configuration is present the
# plugin stays idle: it does not create log files, does not build a
# coordinator, does not subscribe to session events and does not intercept
# llm/stream. Configure it (config.json or env) and restart DSH to activate.
- insert:
    - id: agentarts-instrumentation-dsh
      name: 'agentarts-instrumentation-dsh'
      config:
        enabled: true