# DSH AgentArts Observation Plugin. This bundle owns its OTLP gRPC pipeline
# and reports to AgentArts APM/AOM.
# Actual reporting config is loaded from
# ~/.dsh/plugins/agentarts-instrumentation-dsh/config.json at runtime.
- insert:
    - id: agentarts-instrumentation-dsh
      name: 'agentarts-instrumentation-dsh'
      config:
        enabled: true
